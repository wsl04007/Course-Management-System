spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=CMS_DB;integratedSecurity=true;encrypt=false;trustServerCertificate=true
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
    database-platform: org.hibernate.dialect.SQLServer2012Dialect

jwt:
  secret: cmsSecretKey2024ForJWTTokenGeneration
  expiration: 86400000

server:
  port: 8080
